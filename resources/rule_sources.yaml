# 领域规则源目录：本地高频 + 远程按需拉取
# Agent：先 list/search，再 resolve 命中 id（可选 --rule）；禁止预拉全部远程包
version: 1
policy:
  max_sources_per_task: 2
  prefer_search_slice: true
  cache_ttl_hours: 168

sources:
  - id: local.frontend.aesthetic
    kind: local
    path: references/frontend_aesthetic.md
    tags: [UI, aesthetic, design, anti-slop, typography, hero, Anthropic]
    when: UI 默认审美 — 本地优先于远程 anthropic.frontend-design

  - id: local.frontend.core
    kind: local
    path: references/frontend_craft.md
    tags: [UI, frontend, a11y, design, React, anti-slop, motion, modern-web-guidance]
    when: 改 UI/组件/页面手艺与现代 Web 规范（融合 Modern Web Guidance）— 本地高频（先 aesthetic / DESIGN.md）

  - id: local.testing
    kind: local
    path: references/testing.md
    tags: [test, TDD, seam, quality, 测试, 质量, devtools, chrome-devtools, a11y, memory-leak, lcp]
    when: 实现/门禁 — 测试方法一等公民与运行态 DevTools/CWV 审计

  - id: local.deep.modules
    kind: local
    path: references/deep_modules.md
    tags: [module, seam, adapter, depth, architecture, 深模块, 重构, SDK防腐]
    when: 模块接口 / 可测性 / 外部 SDK 防腐 Adapter / 日常重构对话

  - id: local.grill
    kind: local
    path: references/grill_orchestration.md
    tags: [grill, DESIGN, 审讯, 对齐, 澄清, office-hours, trade-offs]
    when: DESIGN 审讯式对齐与产品方案博弈

  - id: local.product.design
    kind: local
    path: references/product_design.md
    tags: [产品设计, 设计语言, 产品功能, PRD, JTBD, Gherkin, 渐进式披露, FTUE, Aha Moment]
    when: 阶段 0 产品探索、设计语言、UX 四定律与产品功能规格 — 本地高频必守

  - id: local.product.prototype
    kind: local
    path: references/product_prototype.md
    tags: [原型, 线框, ASCII, Mermaid, 四态, prototype, wireframe, UX, openpencil, generative-ui]
    when: 阶段 0 双轨高表现力原型（Mermaid 拓扑 + ASCII 比例线框 + OpenPencil / Generative UI 页面四态）

  - id: local.product.roadmap
    kind: local
    path: references/product_roadmap.md
    tags: [MVP, 分阶段规划, MoSCoW, 路线图, roadmap, 人机交互]
    when: 阶段 0 MVP 裁剪与《产品开发分阶段规划书》

  - id: gstack.office-hours
    kind: github_raw
    repo: garrytan/gstack
    ref: main
    file: office-hours/SKILL.md
    tags: [product, discovery, JTBD, status-quo, wedge, office-hours, YC, 痛点, 产品探索]
    when: 产品探索深化 — 痛点真伪、现状替代方案 (Status Quo) 与最窄切入点追问

  - id: gstack.plan-ceo-review
    kind: github_raw
    repo: garrytan/gstack
    ref: main
    file: plan-ceo-review/SKILL.md
    tags: [product, strategy, 10-star, scope, MVP, Aha-Moment, 产品策略, 评审]
    when: 产品策略与 10 星体验评审（Scope Expansion 惊喜体验 vs Scope Reduction 砍伪需求）

  - id: gstack.plan-design-review
    kind: github_raw
    repo: garrytan/gstack
    ref: main
    file: plan-design-review/SKILL.md
    tags: [UX, UI, design-review, hierarchy, empty-state, interaction, 设计评审, 体验走查]
    when: 交互与设计体验深度评审（信息架构、空状态、交互边缘路径评分）

  - id: deanpeters.pm-prd
    kind: github_raw
    repo: deanpeters/Product-Manager-Skills
    ref: main
    file: skills/prd-development/SKILL.md
    tags: [PRD, JTBD, Gherkin, user-stories, product-manager, 需求规格, 验收标准]
    when: 结构化 PRD、JTBD 问题界定与 Gherkin Given-When-Then 验收标准深化

  - id: uipro.ux-design
    kind: github_raw
    repo: nextlevelbuilder/ui-ux-pro-max-skill
    ref: main
    file: .claude/skills/ui-ux-pro-max/SKILL.md
    tags: [UX, UI, usability, Fitts, Hick, progressive-disclosure, palette, 行业UX, 可用性]
    when: 行业 UX 布局范式、可用性心理学法则与色彩排版配对深化

  - id: local.api.core
    kind: local
    path: references/api_engineering.md
    tags: [API, REST, 契约, 幂等, Mock, 错误码]
    when: 改 API/Mock/契约 — 本地高频必守（先于远程）

  - id: local.dev.paradigm
    kind: local
    path: references/dev_paradigm.md
    tags: [paradigm, 范式, 规模, 类型, architecture, 选型]
    when: 阶段 1～2 按规模/类型选开发范式 — 先于 DDD/分层详规

  - id: local.backend.arch
    kind: local
    path: references/backend_arch.md
    tags: [backend, architecture, hexagonal, clean, 分层, saga]
    when: 后端分层 / 微服务 / Saga — 本地高频（先 local.dev.paradigm）

  - id: local.ddd.design
    kind: local
    path: references/ddd_design.md
    tags: [DDD, domain, 限界上下文, 聚合, 统一语言, architecture]
    when: 范式已选含 DDD 时的战略战术 — 非默认入口

  - id: local.frontend.arch
    kind: local
    path: references/frontend_arch.md
    tags: [frontend, architecture, FSD, feature, 模块]
    when: 前端模块/FSD/与 BC 对齐 — 本地高频（审美走 aesthetic；身份走 design_md）

  - id: vercel.react-rules
    kind: github_tree
    repo: vercel-labs/agent-skills
    ref: main
    base_path: skills/react-best-practices/rules
    catalog_file: skills/react-best-practices/SKILL.md
    tags: [React, Next, performance, async, bundle, rerender, server]
    when: React/Next 性能细则 — resolve --rule <name> 拉单条，勿整读 AGENTS.md
    rule_examples: [async-parallel, bundle-barrel-imports, server-cache-react, rerender-derived-state]

  - id: anthropic.frontend-design
    kind: github_raw
    repo: anthropics/skills
    ref: main
    file: skills/frontend-design/SKILL.md
    tags: [UI, design, aesthetic, typography, hero]
    when: 审美深化 / 对齐上游原文（先 local.frontend.aesthetic；search-cache，勿整灌）

  - id: addy.api-design
    kind: github_raw
    repo: addyosmani/agent-skills
    ref: main
    file: skills/api-and-interface-design/SKILL.md
    tags: [API, contract, idempotency, Hyrum, validation]
    when: API 契约 / 边界 / 幂等深化（本地 craft 不够时）

  - id: addy.frontend-ui
    kind: github_raw
    repo: addyosmani/agent-skills
    ref: main
    file: skills/frontend-ui-engineering/SKILL.md
    tags: [UI, components, state, a11y, forms]
