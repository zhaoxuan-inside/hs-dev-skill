  - id: voltagent.design-md
    kind: github_tree
    repo: VoltAgent/awesome-design-md
    ref: main
    base_path: design-md
    file_template: "{rule}/DESIGN.md"
    catalog_file: README.md
    tags: [DESIGN.md, brand, visual, design-system, UI]
    when: 按品牌拉 DESIGN.md — resolve --rule <slug>（学 token，不克隆品牌）
    rule_examples: [stripe, vercel, linear.app, claude, cursor, notion, apple, spotify, supabase, figma]

