  - id: vercel.web-interface
    kind: github_raw
    repo: vercel-labs/web-interface-guidelines
    ref: main
    file: command.md
    tags: [a11y, web, guidelines, review, focus, forms]
    when: Web 界面合规复审（100+ 条；按需 search-cache）

  # 兼容旧 id：与 vercel.web-interface 同文件
  - id: vercel.web-guidelines
    kind: github_raw
    repo: vercel-labs/web-interface-guidelines
