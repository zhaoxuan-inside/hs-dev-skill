name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: test "$GITHUB_REF_NAME" = "v$(python3 hs-dev-skill/scripts/hs-dev.py --version)"
      - run: python3 hs-dev-skill/scripts/check.py
      - run: python3 -m unittest discover -s hs-dev-skill/tests -v
        env:
          PYTHONPATH: hs-dev-skill/scripts
      - run: python3 hs-dev-skill/scripts/build.py --output "$RUNNER_TEMP/hs-dev-packages"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/hs-dev-packages/*
          body_path: release-notes.md
