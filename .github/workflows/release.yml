name: Publish Skill release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(python3 -c 'import json; print(json.load(open("resources/skill_routes.json"))["bundle_version"])')"
          test "$RELEASE_TAG" = "$expected"
          python3 scripts/skill_router.py check
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m unittest discover -s examples/order_service/test/_01_method_test -p 'test_*.py'
          python3 scripts/verify_consistency.py --root . --demo --strict

      - name: Package tracked files and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          git archive --format=zip --prefix=hs-dev-skill/ --output="release/hs-dev-skill-${RELEASE_TAG}.zip" HEAD -- \
            SKILL.md README.md LICENSE Makefile .gitignore .gitattributes \
            skills scripts references resources examples tests
          cd release
          sha256sum ./*.zip > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS \
            --verify-tag --title "hs-dev-skill ${RELEASE_TAG}" \
            --notes-file .github/release-notes.md --latest
